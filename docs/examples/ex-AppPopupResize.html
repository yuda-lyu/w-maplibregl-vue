<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>example for AppPopupResize</title>

    <!-- @babel/polyfill -->
    <script
        nomodule
        src="https://cdn.jsdelivr.net/npm/@babel/polyfill/dist/polyfill.min.js"
    ></script>

    <!-- vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.min.js"></script>

    <!-- extractHtml已自動添加@babel/polyfill與vue -->

    <!-- maplibre-gl已包入 -->
    <script
        _src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.js"
    ></script>
    <link
        rel="stylesheet"
        _href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.css"
    />

    <!-- w-maplibregl-vue -->
    <script src="https://cdn.jsdelivr.net/npm/w-maplibregl-vue@1.0.42/dist/w-maplibregl-vue.umd.js"></script>

    <!-- lodash -->
    <script src="https://cdn.jsdelivr.net/npm/lodash/lodash.min.js"></script>

    <!-- wsemi -->
    <script src="https://cdn.jsdelivr.net/npm/wsemi/dist/wsemi.umd.min.js"></script>

    <!-- w-gis -->
    <script _src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/w-gis.umd.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/interp2.wk.umd.js"
    ></script>

    <!-- data -->
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRain.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRainClip.js"
    ></script>

    <!-- w-jsonview-tree -->
    <script
        src="https://cdn.jsdelivr.net/npm/w-jsonview-tree@latest/dist/w-jsonview-tree.umd.js"
    ></script>
    <script>
  let jv = window["w-jsonview-tree"];
    </script>

    <style>
  .item-link {
    display: inline-block;
    margin: 10px 10px 0px 0px;
    padding: 5px 10px;
    font-size: 0.8rem;
    color: #fff;
    background-color: #443a65;
    cursor: pointer;
    text-decoration: none;
  }
  .bkh {
    /* 寬 */
    padding: 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkh {
      padding: 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkh {
      padding: 5px;
    }
  }
  .bkp {
    /* 寬 */
    padding: 0px 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkp {
      padding: 0px 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkp {
      padding: 0px 5px;
    }
  }
    </style>
</head>
<body
    style="font-family:'Microsoft JhengHei','Avenir','Helvetica'; padding:0px; margin:0px;"
>
    <div id="app" class="bkh" style>
        <div class="bkh">
            <div style="font-size:1.5rem;">popupResize</div>
            <a
                href="//yuda-lyu.github.io/w-maplibregl-vue/examples/ex-AppPopupResize.html"
                target="_blank"
                class="item-link"
            >example</a>
            <a
                href="//github.com/yuda-lyu/w-maplibregl-vue/blob/master/docs/examples/ex-AppPopupResize.html"
                target="_blank"
                class="item-link"
            >code</a>
        </div>

        <div class="bkp">
            <div style="padding-bottom:10px; font-size:0.85rem;">
                <label style="cursor:pointer; user-select:none;">
                    <input type="checkbox" v-model="opt.popupResize.resizable" />
                    popupResize.resizable（點地圖中央的點開啟 popup；開啟後滑鼠移到 popup 邊/角會顯示把手，可拖曳四邊/四角調整大小，放手保留、翻轉不重置）
                </label>
            </div>

            <div style="position:relative;">
                <w-maplibregl-vue style="width:800px; height:520px;" :opt="opt">
                    <template v-slot:point-popup="props">
                        <div
                            style="width:100%; height:100%; box-sizing:border-box; padding:12px; overflow:auto;"
                        >
                            <div
                                style="font-size:0.9rem; color:#f26;"
                            >[可調整大小 popup]</div>
                            <div
                                style="font-size:0.8rem; color:#777;"
                            >{{ props.point.title }}</div>
                            <div
                                style="font-size:0.75rem; color:#999; padding-top:6px;"
                            >把手平時隱藏，滑鼠移到 popup 邊/角才顯示。</div>
                        </div>
                    </template>
                </w-maplibregl-vue>
            </div>
        </div>
    </div>

    <script>
  //install
  Vue.component("w-maplibregl-vue", window["w-maplibregl-vue"]);

  //initialize
  new Vue({
    el: "#app",

    data: function() {
      return {
        //opt 為穩定 data 物件; 勾選框直接 v-model 到 opt.popupResize.resizable(就地改, 不重建 opt → 不重設視角)
        opt: {
          center: [24.6508, 121.4717],
          zoom: 12,
          popupResize: { resizable: true, width: 320, height: 220 },
          pointSets: [
            {
              title: "Lakes",
              msg: "tears of the mountains",
              size: 16,
              points: [
                {
                  title: "Ming Chi(明池)",
                  msg: "Yingshi Village, Datong Township, Yilan County, Taiwan",
                  latLng: [24.6508143, 121.4716748]
                }
              ],
              visible: true
            }
          ]
        }
      };
    },
    mounted: function() {
      return {};
    },
    computed: {},
    methods: {}
  });
    </script>
</body>
</html>
