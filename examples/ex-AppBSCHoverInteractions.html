<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>example for AppBSCHoverInteractions</title>

    <!-- @babel/polyfill -->
    <script
        nomodule
        src="https://cdn.jsdelivr.net/npm/@babel/polyfill/dist/polyfill.min.js"
    ></script>

    <!-- vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.min.js"></script>

    <!-- extractHtml已自動添加@babel/polyfill與vue -->

    <!-- maplibre-gl已包入 -->
    <script
        _src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.js"
    ></script>
    <link
        rel="stylesheet"
        _href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.css"
    />

    <!-- w-maplibregl-vue -->
    <script src="https://cdn.jsdelivr.net/npm/w-maplibregl-vue@1.0.44/dist/w-maplibregl-vue.umd.js"></script>

    <!-- lodash -->
    <script src="https://cdn.jsdelivr.net/npm/lodash/lodash.min.js"></script>

    <!-- wsemi -->
    <script src="https://cdn.jsdelivr.net/npm/wsemi/dist/wsemi.umd.min.js"></script>

    <!-- w-gis -->
    <script _src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/w-gis.umd.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/interp2.wk.umd.js"
    ></script>

    <!-- data -->
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRain.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRainClip.js"
    ></script>

    <!-- w-jsonview-tree -->
    <script
        src="https://cdn.jsdelivr.net/npm/w-jsonview-tree@latest/dist/w-jsonview-tree.umd.js"
    ></script>
    <script>
  let jv = window["w-jsonview-tree"];
    </script>

    <style>
  .item-link {
    display: inline-block;
    margin: 10px 10px 0px 0px;
    padding: 5px 10px;
    font-size: 0.8rem;
    color: #fff;
    background-color: #443a65;
    cursor: pointer;
    text-decoration: none;
  }
  .bkh {
    /* 寬 */
    padding: 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkh {
      padding: 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkh {
      padding: 5px;
    }
  }
  .bkp {
    /* 寬 */
    padding: 0px 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkp {
      padding: 0px 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkp {
      padding: 0px 5px;
    }
  }
    </style>
</head>
<body
    style="font-family:'Microsoft JhengHei','Avenir','Helvetica'; padding:0px; margin:0px;"
>
    <div id="app" class="bkh" style>
        <div class="bkh">
            <div style="font-size:1.5rem;">hoverInteractions</div>
            <a
                href="//yuda-lyu.github.io/w-maplibregl-vue/examples/ex-AppBSCHoverInteractions.html"
                target="_blank"
                class="item-link"
            >example</a>
            <a
                href="//github.com/yuda-lyu/w-maplibregl-vue/blob/master/docs/examples/ex-AppBSCHoverInteractions.html"
                target="_blank"
                class="item-link"
            >code</a>
        </div>

        <div class="bkp">
            <div
                style="padding-bottom:10px; font-size:0.85rem; color:#777;"
            >各型別互動圖徵集中一頁（點/icon點/點群聚/折線/多邊形/GeoJSON/等值線），滑入顯示 cursor pointer 與 tooltip，點擊點開啟 popup；等值線開啟 changeStyleWhenHover。</div>

            <div style="padding-bottom:10px;">
                <button
                    id="btnMutate"
                    style="cursor:pointer; padding:4px 10px;"
                    @click="mutateRuntime"
                >runtime 變更: 折線換紅色 + 隱藏多邊形</button>
                <button
                    id="btnShiftSets"
                    style="cursor:pointer; padding:4px 10px; margin-left:8px;"
                    @click="shiftSets"
                >runtime 變更: 頭部插入一組 pointSet(索引位移)</button>
                <button
                    id="btnToggleImage"
                    style="cursor:pointer; padding:4px 10px; margin-left:8px;"
                    @click="toggleImage"
                >runtime 變更: 切換影像疊圖顯示</button>
                <button
                    id="btnSwapClick"
                    style="cursor:pointer; padding:4px 10px; margin-left:8px;"
                    @click="swapClick"
                >runtime 變更: 更換全域點擊函數</button>
                <span
                    id="clickLog"
                    style="margin-left:8px; font-size:0.85rem; color:#a3c;"
                ></span>
            </div>

            <div style="position:relative;">
                <w-maplibregl-vue style="width:800px; height:500px;" :opt="opt">
                    <template v-slot:point-popup="props">
                        <div style="padding:12px; width:200px;">
                            <div
                                style="font-size:0.9rem; color:#f26;"
                            >[Point popup]</div>
                            <div
                                style="font-size:0.8rem; color:#777;"
                            >{{ props.point.title }}</div>
                        </div>
                    </template>
                    <template v-slot:point-tooltip="props">
                        <div style="padding:10px; width:180px;">
                            <div
                                style="font-size:0.85rem; color:#f26;"
                            >[Point tooltip]</div>
                            <div
                                style="font-size:0.75rem; color:#777;"
                            >{{ props.point.title }}</div>
                        </div>
                    </template>
                    <template v-slot:polyline-popup="props">
                        <div style="padding:12px; width:200px;">
                            <div
                                style="font-size:0.9rem; color:#26a;"
                            >[Polyline popup]</div>
                            <div
                                style="font-size:0.8rem; color:#777;"
                            >{{ props.polylineSet.title }}</div>
                        </div>
                    </template>
                    <template v-slot:polyline-tooltip="props">
                        <div style="padding:10px; width:180px;">
                            <div
                                style="font-size:0.85rem; color:#26a;"
                            >[Polyline tooltip]</div>
                            <div
                                style="font-size:0.75rem; color:#777;"
                            >{{ props.polylineSet.title }}</div>
                        </div>
                    </template>
                    <template v-slot:polygon-popup="props">
                        <div style="padding:12px; width:200px;">
                            <div
                                style="font-size:0.9rem; color:#4347de;"
                            >[Polygon popup]</div>
                            <div
                                style="font-size:0.8rem; color:#777;"
                            >{{ props.polygonSet.title }}</div>
                        </div>
                    </template>
                    <template v-slot:polygon-tooltip="props">
                        <div style="padding:10px; width:180px;">
                            <div
                                style="font-size:0.85rem; color:#4347de;"
                            >[Polygon tooltip]</div>
                            <div
                                style="font-size:0.75rem; color:#777;"
                            >{{ props.polygonSet.title }}</div>
                        </div>
                    </template>
                    <template v-slot:geojson-popup="props">
                        <div style="padding:12px; width:200px;">
                            <div
                                style="font-size:0.9rem; color:#2a7;"
                            >[Geojson popup]</div>
                            <div
                                style="font-size:0.8rem; color:#777;"
                            >{{ props.geojsonSet.title }}</div>
                        </div>
                    </template>
                    <template v-slot:geojson-tooltip="props">
                        <div style="padding:10px; width:180px;">
                            <div
                                style="font-size:0.85rem; color:#2a7;"
                            >[Geojson tooltip]</div>
                            <div
                                style="font-size:0.75rem; color:#777;"
                            >{{ props.geojsonSet.title }}</div>
                        </div>
                    </template>
                    <template v-slot:contour-popup>
                        <div style="padding:12px; width:200px;">
                            <div
                                style="font-size:0.9rem; color:#a52;"
                            >[Contour popup]</div>
                        </div>
                    </template>
                    <template v-slot:contour-tooltip>
                        <div style="padding:10px; width:180px;">
                            <div
                                style="font-size:0.85rem; color:#a52;"
                            >[Contour tooltip]</div>
                        </div>
                    </template>
                </w-maplibregl-vue>
            </div>
        </div>
    </div>

    <script>
  //install
  Vue.component("w-maplibregl-vue", window["w-maplibregl-vue"]);

  //initialize
  new Vue({
    el: "#app",

    data: function() {
      return {
        opt: {
          center: [24.0, 121.0],
          zoom: 10,
          projection: "mercator", //固定投影, 使畫面座標可由 web mercator 公式直接推算(e2e 換算滑鼠座標用)
          panelItems: { show: false }, //關閉圖層顯隱面板: 其 DOM 覆蓋畫布左側會攔截滑鼠事件, 遮住 hover 目標圖徵
          clusterPoints: true,
          pointSets: [
            {
              title: "pointSet A",
              msg: "points for hover",
              key: "main", //穩定識別 key: 陣列位移時維持組身分, 未變更組可走差異跳過
              size: 18,
              points: [
                {
                  title: "point-circle",
                  msg: "circle point",
                  latLng: [24.08, 120.88]
                },
                {
                  title: "point-icon",
                  msg: "icon point",
                  latLng: [24.08, 121.12],
                  type: "icon"
                }
              ],
              visible: true
            },
            {
              title: "pointSet cluster",
              msg: "co-located points to form a cluster",
              key: "cluster",
              points: [
                { title: "cluster-1", msg: "msg", latLng: [24.08, 121.0] },
                { title: "cluster-2", msg: "msg", latLng: [24.08, 121.0] },
                { title: "cluster-3", msg: "msg", latLng: [24.08, 121.0] },
                { title: "cluster-4", msg: "msg", latLng: [24.08, 121.0] },
                { title: "cluster-5", msg: "msg", latLng: [24.08, 121.0] }
              ],
              visible: true
            }
          ],
          polylineSets: [
            {
              title: "polyline A",
              msg: "line for hover",
              latLngs: [
                [23.92, 120.85],
                [23.92, 120.91]
              ],
              lineWidth: 16,
              visible: true
            },
            {
              title: "polyline B",
              msg: "second line(供跨組 hover/click 測試)",
              latLngs: [
                [23.96, 120.85],
                [23.96, 120.91]
              ],
              lineColor: "rgba(30,180,90,1)",
              lineWidth: 16,
              visible: true
            }
          ],
          polygonSets: [
            {
              title: "polygon A",
              msg: "polygon for hover",
              latLngs: [
                [
                  [23.9, 120.98],
                  [23.9, 121.02],
                  [23.94, 121.02],
                  [23.94, 120.98]
                ]
              ],
              fillColor: "rgba(80,120,255,0.5)",
              visible: true
            },
            {
              title: "polygon B",
              msg:
                "adjacent polygon(與 A 部分重疊, 供跨組 hover 與重疊點擊測試)",
              latLngs: [
                [
                  [23.9, 121.01],
                  [23.9, 121.05],
                  [23.94, 121.05],
                  [23.94, 121.01]
                ]
              ],
              fillColor: "rgba(255,150,60,0.7)",
              visible: true
            }
          ],
          geojsonSets: [
            {
              title: "geojson A",
              msg: "geojson polygon for hover",
              geojson: {
                type: "FeatureCollection",
                features: [
                  {
                    type: "Feature",
                    properties: {},
                    geometry: {
                      type: "Polygon",
                      coordinates: [
                        [
                          [121.1, 23.9],
                          [121.14, 23.9],
                          [121.14, 23.94],
                          [121.1, 23.94],
                          [121.1, 23.9]
                        ]
                      ]
                    }
                  }
                ]
              },
              visible: true
            },
            {
              title: "geojson B",
              msg: "adjacent geojson polygon(供跨組 hover/click 測試)",
              geojson: {
                type: "FeatureCollection",
                features: [
                  {
                    type: "Feature",
                    properties: {},
                    geometry: {
                      type: "Polygon",
                      coordinates: [
                        [
                          [121.15, 23.9],
                          [121.19, 23.9],
                          [121.19, 23.94],
                          [121.15, 23.94],
                          [121.15, 23.9]
                        ]
                      ]
                    }
                  }
                ]
              },
              visible: true
            }
          ],
          imageSets: [
            {
              title: "image A",
              msg: "raster overlay(data-URI 色塊)",
              image: {
                //1x1 紅色 PNG, 拉伸鋪滿範圍(免網路, e2e 穩定)
                url:
                  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==",
                lngMin: 121.06,
                lngMax: 121.1,
                latMin: 23.96,
                latMax: 24.0
              },
              visible: true
            }
          ],
          contourSets: [
            {
              title: "contour A",
              msg: "contour for hover",
              points: [
                [23.96, 121.14, 0],
                [23.96, 121.18, 0],
                [23.96, 121.22, 0],
                [24.0, 121.14, 0],
                [24.0, 121.18, 50],
                [24.0, 121.22, 0],
                [24.04, 121.14, 0],
                [24.04, 121.18, 0],
                [24.04, 121.22, 0]
              ],
              changeStyleWhenHover: true,
              visible: true
            }
          ]
        }
      };
    },
    mounted: function() {
      return {};
    },
    computed: {},
    methods: {
      //runtime 變更展示: 折線改紅色(setData 路徑同步更新 paint), 直接改 opt 的 visible 隱藏多邊形
      //(欄位初始不存在, Vue 2 須用 $set 新增才能觸發 deep watcher)
      mutateRuntime: function() {
        this.$set(this.opt.polylineSets[0], "lineColor", "rgba(230,30,30,1)");
        this.$set(this.opt.polygonSets[0], "visible", false);
      },
      //runtime 更換全域點擊函數(欄位初始不存在, Vue 2 須用 $set 新增才能觸發 watcher):
      //點擊點圖徵時新函數將訊息寫入 #clickLog, 供驗證更換有生效
      swapClick: function() {
        this.$set(this.opt, "pointSetsClick", function(msg) {
          document.querySelector(
            "#clickLog"
          ).textContent = `swapped:${msg.point.title}`;
        });
      },
      //直接改 opt 的 visible 切換影像疊圖(驗證 visible 直改路徑與影像重建)
      toggleImage: function() {
        this.opt.imageSets[0].visible = !this.opt.imageSets[0].visible;
      },
      //於陣列頭部插入一組新 pointSet(索引位移情境): 其後各組整體位移一格, 驗證位移後各組行為仍正確
      shiftSets: function() {
        this.opt.pointSets.unshift({
          title: "pointSet head",
          msg: "inserted at head",
          key: "head",
          size: 18,
          points: [
            { title: "point-head", msg: "head point", latLng: [24.0, 120.88] }
          ],
          visible: true
        });
      }
    }
  });
    </script>
</body>
</html>
