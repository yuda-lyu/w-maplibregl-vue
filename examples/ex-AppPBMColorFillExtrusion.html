<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>example for AppPBMColorFillExtrusion</title>

    <!-- @babel/polyfill -->
    <script
        nomodule
        src="https://cdn.jsdelivr.net/npm/@babel/polyfill/dist/polyfill.min.js"
    ></script>

    <!-- vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.min.js"></script>

    <!-- extractHtml已自動添加@babel/polyfill與vue -->

    <!-- maplibre-gl已包入 -->
    <script
        _src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.js"
    ></script>
    <link
        rel="stylesheet"
        _href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.css"
    />

    <!-- w-maplibregl-vue -->
    <script src="https://cdn.jsdelivr.net/npm/w-maplibregl-vue@1.0.41/dist/w-maplibregl-vue.umd.js"></script>

    <!-- lodash -->
    <script src="https://cdn.jsdelivr.net/npm/lodash/lodash.min.js"></script>

    <!-- wsemi -->
    <script src="https://cdn.jsdelivr.net/npm/wsemi/dist/wsemi.umd.min.js"></script>

    <!-- w-gis -->
    <script _src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/w-gis.umd.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/interp2.wk.umd.js"
    ></script>

    <!-- data -->
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRain.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRainClip.js"
    ></script>

    <!-- w-jsonview-tree -->
    <script
        src="https://cdn.jsdelivr.net/npm/w-jsonview-tree@latest/dist/w-jsonview-tree.umd.js"
    ></script>
    <script>
  let jv = window["w-jsonview-tree"];
    </script>

    <style>
  .item-link {
    display: inline-block;
    margin: 10px 10px 0px 0px;
    padding: 5px 10px;
    font-size: 0.8rem;
    color: #fff;
    background-color: #443a65;
    cursor: pointer;
    text-decoration: none;
  }
  .bkh {
    /* 寬 */
    padding: 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkh {
      padding: 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkh {
      padding: 5px;
    }
  }
  .bkp {
    /* 寬 */
    padding: 0px 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkp {
      padding: 0px 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkp {
      padding: 0px 5px;
    }
  }
    </style>
</head>
<body
    style="font-family:'Microsoft JhengHei','Avenir','Helvetica'; padding:0px; margin:0px;"
>
    <div id="app" class="bkh" style>
        <div class="bkh">
            <div style="font-size:1.5rem;">baseMap.colorFillExtrusion</div>
            <a
                href="//yuda-lyu.github.io/w-maplibregl-vue/examples/ex-AppPBMColorFillExtrusion.html"
                target="_blank"
                class="item-link"
            >example</a>
            <a
                href="//github.com/yuda-lyu/w-maplibregl-vue/blob/master/docs/examples/ex-AppPBMColorFillExtrusion.html"
                target="_blank"
                class="item-link"
            >code</a>
        </div>

        <div class="bkp">
            <div style="padding-bottom:10px; font-size:0.85rem;">
                建物統一色
                <b>colorFillExtrusion</b>：
                <button
                    v-for="c in colors"
                    :key="String(c.val)"
                    @click="setColor(c.val)"
                    :style="btnStyle(c.val)"
                >{{ c.label }}</button>
                <span
                    style="color:#777; padding-left:8px;"
                >目前：{{ color || '資料原色(coalesce colour)' }} · 按住右鍵拖曳可傾斜看 3D 立體建物（換色不會重設視角）</span>
            </div>

            <div style="position:relative;">
                <w-maplibregl-vue style="width:900px; height:560px;" :opt="opt"></w-maplibregl-vue>
            </div>
        </div>
    </div>

    <script>
  //install
  Vue.component("w-maplibregl-vue", window["w-maplibregl-vue"]);

  //initialize
  new Vue({
    el: "#app",

    data: function() {
      return {
        color: "#ff7d32",
        colors: [
          { label: "資料原色", val: null },
          { label: "灰", val: "#aaaaaa" },
          { label: "橘", val: "#ff7d32" },
          { label: "藍", val: "#4347de" },
          { label: "綠", val: "#2db84a" }
        ],
        //opt 為穩定 data 物件(非 computed): 換色只就地改建物 entry 的 colorFillExtrusion,
        //不重建 opt → 不覆寫 center/zoom(元件會於 moveend/zoomend 將使用者實際視角寫回 opt.center/zoom)
        opt: {
          center: [25.0336, 121.5645], //台北信義區(台北101周邊, 建物密集)
          zoom: 16,
          panelBaseMaps: {
            baseMaps: [
              {
                name: "OSM",
                url: "//{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                colorShade: "light",
                opacity: 1,
                visible: true
              },
              {
                name: "3D建物(OpenFreeMap)",
                type: "vector",
                url: "//tiles.openfreemap.org/planet",
                layer: "building",
                layerType: "fill-extrusion",
                colorShade: "", //空字串=疊加層(overlay)
                opacity: 0.9,
                visible: true,
                colorFillExtrusion: "#ff7d32" //不傳則回退資料 colour 屬性
              }
            ]
          }
        }
      };
    },
    mounted: function() {
      return {};
    },
    computed: {},
    methods: {
      setColor: function(c) {
        let vo = this;
        vo.color = c;
        let b = vo.opt.panelBaseMaps.baseMaps[1]; //建物 entry
        if (c) vo.$set(b, "colorFillExtrusion", c);
        else vo.$delete(b, "colorFillExtrusion"); //資料原色: 移除欄位回退 coalesce colour
      },
      btnStyle: function(c) {
        let active = this.color === c;
        return {
          margin: "0 3px",
          padding: "3px 10px",
          cursor: "pointer",
          borderRadius: "4px",
          border: active ? "2px solid #f26" : "1px solid #ccc",
          background: active ? "#fff0f4" : "#fff"
        };
      }
    }
  });
    </script>
</body>
</html>
