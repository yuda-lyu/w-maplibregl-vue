<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>example for AppBSCDisplayOrderByType</title>

    <!-- @babel/polyfill -->
    <script
        nomodule
        src="https://cdn.jsdelivr.net/npm/@babel/polyfill/dist/polyfill.min.js"
    ></script>

    <!-- vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.min.js"></script>

    <!-- extractHtml已自動添加@babel/polyfill與vue -->

    <!-- maplibre-gl已包入 -->
    <script
        _src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.js"
    ></script>
    <link
        rel="stylesheet"
        _href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.css"
    />

    <!-- w-maplibregl-vue -->
    <script src="https://cdn.jsdelivr.net/npm/w-maplibregl-vue@1.0.43/dist/w-maplibregl-vue.umd.js"></script>

    <!-- lodash -->
    <script src="https://cdn.jsdelivr.net/npm/lodash/lodash.min.js"></script>

    <!-- wsemi -->
    <script src="https://cdn.jsdelivr.net/npm/wsemi/dist/wsemi.umd.min.js"></script>

    <!-- w-gis -->
    <script _src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/w-gis.umd.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/interp2.wk.umd.js"
    ></script>

    <!-- data -->
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRain.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRainClip.js"
    ></script>

    <!-- w-jsonview-tree -->
    <script
        src="https://cdn.jsdelivr.net/npm/w-jsonview-tree@latest/dist/w-jsonview-tree.umd.js"
    ></script>
    <script>
  let jv = window["w-jsonview-tree"];
    </script>

    <style>
  .item-link {
    display: inline-block;
    margin: 10px 10px 0px 0px;
    padding: 5px 10px;
    font-size: 0.8rem;
    color: #fff;
    background-color: #443a65;
    cursor: pointer;
    text-decoration: none;
  }
  .bkh {
    /* 寬 */
    padding: 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkh {
      padding: 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkh {
      padding: 5px;
    }
  }
  .bkp {
    /* 寬 */
    padding: 0px 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkp {
      padding: 0px 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkp {
      padding: 0px 5px;
    }
  }
    </style>
</head>
<body
    style="font-family:'Microsoft JhengHei','Avenir','Helvetica'; padding:0px; margin:0px;"
>
    <div id="app" class="bkh" style>
        <div class="bkh">
            <div style="font-size:1.5rem;">displayOrderByType</div>
            <a
                href="//yuda-lyu.github.io/w-maplibregl-vue/examples/ex-AppBSCDisplayOrderByType.html"
                target="_blank"
                class="item-link"
            >example</a>
            <a
                href="//github.com/yuda-lyu/w-maplibregl-vue/blob/master/docs/examples/ex-AppBSCDisplayOrderByType.html"
                target="_blank"
                class="item-link"
            >code</a>
        </div>

        <div class="bkp">
            <div style="padding-bottom:10px; font-size:0.85rem;">
                <label style="cursor:pointer; user-select:none;">
                    <input id="chkOrder" type="checkbox" v-model="orderByType" />
                    displayOrderByType (開啟時點/線/面依面積堆疊、點在最上，點擊命中最上層型別；關閉則依插入順序、點擊回到原行為)
                </label>
            </div>

            <div style="position:relative;">
                <w-maplibregl-vue style="width:800px; height:500px;" :opt="opt">
                    <template v-slot:point-popup="props">
                        <div style="padding:12px; width:200px;">
                            <div
                                style="font-size:0.9rem; color:#f26;"
                            >[Point popup]</div>
                            <div
                                style="font-size:0.8rem; color:#777;"
                            >{{ props.point.title }}</div>
                        </div>
                    </template>
                    <template v-slot:polygon-popup="props">
                        <div style="padding:12px; width:200px;">
                            <div
                                style="font-size:0.9rem; color:#4347de;"
                            >[Polygon popup]</div>
                            <div
                                style="font-size:0.8rem; color:#777;"
                            >{{ props.polygonSet.title }}</div>
                        </div>
                    </template>
                </w-maplibregl-vue>
            </div>
        </div>
    </div>

    <script>
  //install
  Vue.component("w-maplibregl-vue", window["w-maplibregl-vue"]);

  //initialize
  new Vue({
    el: "#app",

    data: function() {
      return {
        orderByType: true,
        baseOpt: {
          center: [24.0, 121.0],
          zoom: 11,
          polygonSets: [
            {
              title: "覆蓋面 polygon",
              msg: "面覆蓋住點所在區域",
              latLngs: [
                [
                  [23.85, 120.85],
                  [23.85, 121.15],
                  [24.15, 121.15],
                  [24.15, 120.85]
                ]
              ],
              fillColor: "rgba(255,80,80,0.4)",
              visible: true
            }
          ],
          pointSets: [
            {
              title: "上層點 pointSet",
              msg: "tears of the mountains",
              size: 18,
              points: [
                { title: "位於面中央的點", msg: "msg", latLng: [24.0, 121.0] }
              ],
              visible: true
            }
          ]
        }
      };
    },
    mounted: function() {
      return {};
    },
    computed: {
      opt: function() {
        return { ...this.baseOpt, displayOrderByType: this.orderByType };
      }
    },
    methods: {}
  });
    </script>
</body>
</html>
