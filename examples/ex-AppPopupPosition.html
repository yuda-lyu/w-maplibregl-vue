<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>example for AppPopupPosition</title>

    <!-- @babel/polyfill -->
    <script
        nomodule
        src="https://cdn.jsdelivr.net/npm/@babel/polyfill/dist/polyfill.min.js"
    ></script>

    <!-- vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.min.js"></script>

    <!-- extractHtml已自動添加@babel/polyfill與vue -->

    <!-- maplibre-gl已包入 -->
    <script
        _src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.js"
    ></script>
    <link
        rel="stylesheet"
        _href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.20.0/dist/maplibre-gl.min.css"
    />

    <!-- w-maplibregl-vue -->
    <script src="https://cdn.jsdelivr.net/npm/w-maplibregl-vue@1.0.33/dist/w-maplibregl-vue.umd.js"></script>

    <!-- lodash -->
    <script src="https://cdn.jsdelivr.net/npm/lodash/lodash.min.js"></script>

    <!-- wsemi -->
    <script src="https://cdn.jsdelivr.net/npm/wsemi/dist/wsemi.umd.min.js"></script>

    <!-- w-gis -->
    <script _src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/w-gis.umd.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-gis@latest/dist/interp2.wk.umd.js"
    ></script>

    <!-- data -->
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRain.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRainClip.js"
    ></script>

    <!-- w-jsonview-tree -->
    <script
        src="https://cdn.jsdelivr.net/npm/w-jsonview-tree@latest/dist/w-jsonview-tree.umd.js"
    ></script>
    <script>
  let jv = window["w-jsonview-tree"];
    </script>

    <style>
  .item-link {
    display: inline-block;
    margin: 10px 10px 0px 0px;
    padding: 5px 10px;
    font-size: 0.8rem;
    color: #fff;
    background-color: #443a65;
    cursor: pointer;
    text-decoration: none;
  }
  .bkh {
    /* 寬 */
    padding: 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkh {
      padding: 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkh {
      padding: 5px;
    }
  }
  .bkp {
    /* 寬 */
    padding: 0px 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkp {
      padding: 0px 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkp {
      padding: 0px 5px;
    }
  }
    </style>
</head>
<body
    style="font-family:'Microsoft JhengHei','Avenir','Helvetica'; padding:0px; margin:0px;"
>
    <div id="app" class="bkh" style>
        <div class="bkh">
            <div style="font-size:1.5rem;">popupPosition</div>
            <a
                href="//yuda-lyu.github.io/w-maplibregl-vue/examples/ex-AppPopupPosition.html"
                target="_blank"
                class="item-link"
            >example</a>
            <a
                href="//github.com/yuda-lyu/w-maplibregl-vue/blob/master/docs/examples/ex-AppPopupPosition.html"
                target="_blank"
                class="item-link"
            >code</a>
        </div>

        <div class="bkp">
            <div style="padding-bottom:10px; font-size:0.85rem;">
                popupPosition：
                <button
                    v-for="p in positions"
                    :key="p"
                    @click="setPos(p)"
                    :style="btnStyle(p)"
                >{{ p }}</button>
                <span
                    style="color:#777; padding-left:8px;"
                >選方向後自動於中央點開啟 popup；靠近地圖邊緣時會自動翻轉到相反方向</span>
            </div>

            <div style="position:relative;">
                <w-maplibregl-vue
                    ref="map"
                    style="width:800px; height:520px;"
                    :opt="opt"
                >
                    <template v-slot:point-popup="props">
                        <div style="padding:12px; width:220px;">
                            <div
                                style="font-size:0.9rem; color:#f26;"
                            >[popupPosition = {{ opt.popupPosition }}]</div>
                            <div
                                style="font-size:0.8rem; color:#777;"
                            >{{ props.point.title }}</div>
                        </div>
                    </template>
                </w-maplibregl-vue>
            </div>
        </div>
    </div>

    <script>
  //install
  Vue.component("w-maplibregl-vue", window["w-maplibregl-vue"]);

  //initialize
  new Vue({
    el: "#app",

    data: function() {
      return {
        positions: ["top", "bottom", "left", "right"],
        ptLatLng: [24.6508143, 121.4716748],
        //opt 為穩定 data 物件; 換方向只就地改 opt.popupPosition, 不重建 opt
        opt: {
          center: [24.6508, 121.4717],
          zoom: 12,
          popupPosition: "top",
          pointSets: [
            {
              title: "Lakes",
              size: 16,
              points: [
                {
                  id: "A",
                  title: "Ming Chi(明池)",
                  msg: "Yilan, Taiwan",
                  latLng: [24.6508143, 121.4716748]
                }
              ],
              visible: true
            }
          ]
        }
      };
    },
    mounted: function() {
      let vo = this;
      //初始開一次 popup
      vo.$nextTick(() => {
        setTimeout(() => vo.openPopup(), 600);
      });
    },
    computed: {},
    methods: {
      openPopup: function() {
        let vo = this;
        if (vo.$refs.map) {
          vo.$refs.map.popupPoint({ point: { id: "A", latLng: vo.ptLatLng } });
        }
      },
      setPos: function(p) {
        let vo = this;
        vo.opt.popupPosition = p; //就地改, 觸發 changeOpt 更新 vo.popupPosition
        vo.$nextTick(() => {
          setTimeout(() => vo.openPopup(), 60); //待 changeOpt 套用後重開 popup, 觀察新方向
        });
      },
      btnStyle: function(p) {
        let active = this.opt.popupPosition === p;
        return {
          margin: "0 3px",
          padding: "3px 12px",
          cursor: "pointer",
          borderRadius: "4px",
          border: active ? "2px solid #f26" : "1px solid #ccc",
          background: active ? "#fff0f4" : "#fff"
        };
      }
    }
  });
    </script>
</body>
</html>
